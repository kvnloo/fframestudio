area:docs:
  - changed-files:
    - any-glob-to-any-file:
      - 'docs/**/*'
      - '*.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'CONTRIBUTING.md'

area:loop:
  - changed-files:
    - any-glob-to-any-file: '.github/**/*'

area:verify:
  - changed-files:
    - any-glob-to-any-file:
      - 'test/**'
      - 'tools/verify*'
      - 'scripts/**/*'
      - '**/*.test.*'
